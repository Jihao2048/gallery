<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片展示</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <div class="gallery-container">
        <div class="gallery" id="dynamicGallery"></div>
    </div>
    
    <script src="dat.js"></script>
    <script>
    let activeImg = null;
    let gyroActive = false;
    
    // 修改数据引用为photodata
    window.addEventListener('DOMContentLoaded', () => {
        initGallery(photodata);
        setupMouseAndGyroEvents();
    });
    
    // 请求陀螺仪权限并开启监听
    function requestAndStartGyro(img) {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            // iOS 13+
            DeviceOrientationEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') {
                        activeImg = img;
                        gyroActive = true;
                        window.addEventListener('deviceorientation', handleGyro);
                    }
                })
                .catch(console.error);
        } else {
            // Android 或其他浏览器
            activeImg = img;
            gyroActive = true;
            window.addEventListener('deviceorientation', handleGyro);
        }
    }
    
    // 处理陀螺仪数据
    function handleGyro(event) {
        if (!activeImg || !gyroActive) return;
        
        const beta = event.beta || 0;   // X轴旋转 (-180-180)
        const gamma = event.gamma || 0; // Y轴旋转 (-90-90)
        
        // 将陀螺仪数据转换为倾斜角度
        const rotateX = (beta / 180) * 15;  // 最多±15°
        const rotateY = (gamma / 90) * 20;  // 最多±20°
        
        activeImg.style.transform = `
            perspective(1200px)
            rotateX(${rotateX}deg)
            rotateY(${rotateY}deg)
            translateZ(20px)
        `;
    }
    
    // 停止陀螺仪监听
    function stopGyro() {
        window.removeEventListener('deviceorientation', handleGyro);
        gyroActive = false;
        activeImg = null;
    }
    
    function setupMouseAndGyroEvents() {
        document.querySelectorAll('.gallery img').forEach(img => {
            // 鼠标移动事件（桌面设备）
            img.addEventListener('mousemove', (e) => {
                if (gyroActive) return; // 陀螺仪激活时不用鼠标
                
                const rect = img.getBoundingClientRect();
                const xRatio = (e.clientX - rect.left) / rect.width;
                const yRatio = (e.clientY - rect.top) / rect.height;
                
                const rotateY = (xRatio - 0.5) * 20;
                const rotateX = (0.5 - yRatio) * 15;
                
                img.style.transform = `
                    perspective(1200px)
                    rotateX(${rotateX}deg)
                    rotateY(${rotateY}deg)
                    translateZ(20px)
                `;
            });
        
            // 鼠标离开事件
            img.addEventListener('mouseleave', () => {
                if (!gyroActive) {
                    img.style.transform = 'none';
                }
            });
            
            // 点击事件 - 开启陀螺仪
            img.addEventListener('click', (e) => {
                e.stopPropagation();
                
                if (activeImg && activeImg !== img) {
                    stopGyro();
                    activeImg.style.transform = 'none';
                }
                
                // 检查是否支持陀螺仪
                if (typeof DeviceOrientationEvent !== 'undefined') {
                    requestAndStartGyro(img);
                }
            });
        });
        
        // 点击其他地方关闭陀螺仪
        document.addEventListener('click', () => {
            if (gyroActive) {
                stopGyro();
                activeImg.style.transform = 'none';
            }
        });
    }
    
    function initGallery(dataSource) {
        const container = document.getElementById('dynamicGallery');
        container.innerHTML = dataSource.map(item => `
            <div class="img-card">
                <img src="${item.url}" alt="${item.tag}">
                <div class="meta-overlay">
                    <p>Shot with ${item.shotwith}</p>
                    <p>Shot on ${item.date}</p>
                </div>
            </div>
        `).join('');
        setupMouseAndGyroEvents();
    }
    </script>
</body>
</html>
