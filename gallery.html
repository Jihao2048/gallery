<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片展</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <div class="gallery-container">
        <div class="gallery" id="dynamicGallery"></div>
    </div>
    <h1>© 2022-2025</h1>
    <script src="dat.js"></script>
    <script>
        const photodata = [
            {url:"image/1.JPG", shotwith:'iPhone SE 1st generation', date:'February 16, 2024 3:52 PM'},
            {url:"image/3.JPG", shotwith:'iPhone SE 2nd generation', date:'April 5, 2025 2:56 PM'},
            {url:"image/5.JPG", shotwith:'iPhone SE 2nd generation', date:'May 18, 2025 11:07 AM'},
            {url:"image/6.JPG", shotwith:'iPhone SE 2nd generation', date:'June 28, 2025 12:43 PM'}, 
            {url:"image/7.JPG", shotwith:'iPhone SE 1st generation', date:'July 19, 2024 6:45 PM'}, 
            {url:"image/8.JPG", shotwith:'iPhone SE 2nd generation', date:'August 22, 2025 7:23 PM'}, 
            {url:"image/9.JPG", shotwith:'iPhone SE 2nd generation', date:'August 23, 2025 10:55 AM'}, 
            {url:"image/10.jpg", shotwith:'OPPO K9 Pro 5G', date:'October 15, 2022 3:58 PM'}
        ];
    // 修改数据引用为photodata
    window.addEventListener('DOMContentLoaded', () => {
        initGallery(photodata);
        // 新增倾斜效果代码
        document.querySelectorAll('.gallery img').forEach(img => {
            img.addEventListener('mousemove', (e) => {
                const rect = img.getBoundingClientRect();
                const xRatio = (e.clientX - rect.left) / rect.width;
                const yRatio = (e.clientY - rect.top) / rect.height;
                
                const rotateY = (xRatio - 0.5) * 20; // X轴倾斜±10°
                const rotateX = (0.5 - yRatio) * 15;  // Y轴倾斜±7.5°
                
                img.style.transform = `
                    perspective(1200px)
                    rotateX(${rotateX}deg)
                    rotateY(${rotateY}deg)
                    translateZ(20px)
                `;
            });
        
            img.addEventListener('mouseleave', () => {
                img.style.transform = 'none';
            });
        });
    });
    
    function initGallery(dataSource) {
        const container = document.getElementById('dynamicGallery');
        container.innerHTML = dataSource.map(item => `
            <div class="img-card">
                <img src="${item.url}" alt="${item.tag}">
                <div class="meta-overlay">
                    <p>Shot with ${item.shotwith}</p>
                    <p>Shot on ${item.date}</p>
                </div>
            </div>
        `).join('');
    }
    </script>
</body>
</html>
